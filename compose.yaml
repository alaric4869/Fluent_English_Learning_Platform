services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: english_tool
      POSTGRES_USER: english_tool
      POSTGRES_PASSWORD: english_tool_local
    ports:
      - "5432:5432"
    volumes:
      - english_tool_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english_tool -d english_tool"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      ENGLISH_TOOL_DATABASE_URL: postgresql+psycopg://english_tool:english_tool_local@postgres:5432/english_tool
      ENGLISH_TOOL_LOCAL_USER_KEY: local-user
      ENGLISH_TOOL_AI_PROVIDER: disabled
      ENGLISH_TOOL_FRONTEND_ORIGINS: '["http://127.0.0.1:5173","http://localhost:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./resources:/resources:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  english_tool_postgres:
