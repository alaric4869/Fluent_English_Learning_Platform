[project]
name = "fluent-daily-english-fastapi"
version = "0.1.0"
description = "Python-first adaptive English learning application"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
ai = [
  "openai>=1.68,<3",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "rapidocr-onnxruntime>=1.4,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
